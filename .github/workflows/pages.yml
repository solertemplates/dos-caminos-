name: Publicar en GitHub Pages
on:
  push:
    branches: ["main", "claude/dos-caminos-video-app-vhgg8o"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# un despliegue no cancela al que ya está publicando (si no, Pages puede quedarse en una versión vieja)
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # 1) preparar el paquete de la web
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  # 2) publicarlo en otro trabajo (así el paquete ya está registrado en GitHub cuando se publica)
  #    y, si GitHub falla un momento al encontrarlo, se reintenta solo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
